# Minecraft server properties - tuned for a small friends/family server.
# Full reference: https://minecraft.wiki/w/Server.properties

# --- Network ---
server-port=25565
server-ip=
online-mode=true
prevent-proxy-connections=false
enforce-secure-profile=true

# --- World ---
level-name=world
level-seed=
gamemode=survival
difficulty=easy
hardcore=false
allow-nether=true
pvp=true

# --- Players ---
max-players=20
white-list=false
spawn-protection=16
max-world-size=29999984

# --- Performance (sane defaults for a home machine) ---
view-distance=10
simulation-distance=10
entity-broadcast-range-percentage=100
tick-distance=4

# --- Gameplay ---
spawn-monsters=true
spawn-animals=true
spawn-npcs=true
generate-structures=true
enable-command-block=false
op-permission-level=4
function-permission-level=2

# --- Misc ---
motd=Perpetua
server-name=NeptuneCraft
enable-status=true
enable-query=false
enable-rcon=false
broadcast-console-to-ops=true
broadcast-rcon-to-ops=true
sync-chunk-writes=true
player-idle-timeout=0
use-native-transport=true
